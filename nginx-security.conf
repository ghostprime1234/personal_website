server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Block access to non-web files that may end up in the web root
    location ~* ^/(Dockerfile|docker-compose.*\.yml|\.dockerignore|nginx-security\.conf|wpad\.dat|.*\.md|\.git) {
        return 403;
    }

    # Block dotfiles
    location ~ /\. {
        return 403;
    }

    location / {
    	root /usr/share/nginx/html;
    	index index.html index.htm;
        try_files $uri $uri/ =404;
    }
}

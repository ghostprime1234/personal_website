services:
  web:
    build: .
    container_name: personal-website
    ports:
      - "8080:80"
    volumes:
      - .:/usr/share/nginx/html:ro,Z
      - ./nginx-security.conf:/etc/nginx/conf.d/default.conf:ro,Z
    restart: unless-stopped
    networks:
      - proxy-tier

networks:
  proxy-tier:
    external: true
